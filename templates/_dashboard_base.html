<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}FoodFlow Dashboard{% endblock %}</title>
<meta name="description" content="{% block meta_description %}FoodFlow operations dashboard.{% endblock %}" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: { DEFAULT: '#ea580c', dark: '#c2410c', light: '#fff1e6' },
          accent: { DEFAULT: '#0d9488', dark: '#0f766e' },
          ink: { DEFAULT: '#1c1917', soft: '#57534e' },
          surface: '#fffaf3',
          border: '#f0e4d4',
          success: '#15803d',
          warning: '#b45309',
          danger: '#b91c1c',
          info: '#0369a1'
        },
        fontFamily: {
          display: ['Poppins', 'sans-serif'],
          body: ['Inter', 'sans-serif']
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="/static/css/styles.css" />
{% block extra_head %}{% endblock %}
</head>
<body class="font-body bg-surface text-ink antialiased" {% block body_attrs %}{% endblock %}>
<a href="#dash-main" class="sr-only-focusable fixed top-2 left-2 z-[999] bg-primary text-white px-4 py-2 rounded-lg">Skip to main content</a>

<div class="min-h-screen flex flex-col md:flex-row">

  <!-- Mobile top bar -->
  <div class="md:hidden flex items-center justify-between px-4 h-16 border-b border-border bg-white sticky top-0 z-40">
    <a href="/" class="flex items-center gap-2 font-display font-bold text-lg text-ink">
      <span class="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11h18M3 11a9 9 0 0 1 18 0M3 11v2a9 9 0 0 0 18 0v-2M6 19h12"/></svg>
      </span>
      FoodFlow
    </a>
    <button type="button" id="dash-mobile-menu-btn" class="inline-flex items-center justify-center w-11 h-11 rounded-xl hover:bg-primary-light" aria-expanded="false" aria-controls="dash-sidebar" aria-label="Open dashboard menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>

  <aside id="dash-sidebar" class="hidden md:flex md:flex-col w-full md:w-64 shrink-0 bg-white border-b md:border-b-0 md:border-r border-border p-4 md:min-h-screen md:sticky md:top-0" aria-label="Dashboard navigation">
    <a href="/" class="hidden md:flex items-center gap-2 font-display font-bold text-lg text-ink mb-6 px-2">
      <span class="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11h18M3 11a9 9 0 0 1 18 0M3 11v2a9 9 0 0 0 18 0v-2M6 19h12"/></svg>
      </span>
      FoodFlow
    </a>
    <div class="mb-4 px-2">
      <span class="badge badge-info" id="dash-role-badge">{% block dash_role %}Dashboard{% endblock %}</span>
    </div>
    <nav class="flex flex-col gap-1 text-sm" aria-label="Dashboard sections">
      {% block sidebar_links %}{% endblock %}
    </nav>
    <div class="mt-auto pt-4 border-t border-border">
      <a href="/" class="dash-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg> Back to site</a>
    </div>
  </aside>

  <main id="dash-main" tabindex="-1" class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8">
    {% block content %}{% endblock %}
  </main>
</div>

<div id="toast-region" aria-live="polite" aria-atomic="true"></div>

<script src="/static/js/api.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/app.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
