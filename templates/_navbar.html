<header class="sticky top-0 z-50 bg-surface/95 backdrop-blur border-b border-border">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 gap-3">

      <div class="flex items-center gap-6">
        <a href="/" class="flex items-center gap-2 font-display font-bold text-xl text-ink shrink-0" aria-label="FoodFlow home">
          <span class="w-9 h-9 rounded-xl bg-primary text-white flex items-center justify-center text-lg" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M3 11a9 9 0 0 1 18 0M3 11v2a9 9 0 0 0 18 0v-2M6 19h12"/></svg>
          </span>
          FoodFlow
        </a>

        <button type="button" id="location-selector" class="hidden md:flex items-center gap-1.5 text-sm font-medium text-ink-soft hover:text-ink" aria-haspopup="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span id="location-selector-label">Set location</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>

      <form action="/restaurants" method="get" class="hidden lg:flex flex-1 max-w-md relative" role="search">
        <label for="nav-search" class="sr-only">Search restaurants or food</label>
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-soft" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="nav-search" name="q" type="search" placeholder="Search restaurants or dishes..." class="field-input !pl-9 !min-h-[42px]" />
      </form>

      <div class="flex items-center gap-1 sm:gap-2">
        <a href="/cart" class="relative inline-flex items-center justify-center w-11 h-11 rounded-xl hover:bg-primary-light text-ink" aria-label="View cart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span id="cart-count-badge" class="hidden absolute -top-1 -right-1 bg-primary text-white text-[10px] font-bold w-5 h-5 rounded-full items-center justify-center" aria-hidden="true">0</span>
        </a>

        <div class="relative">
          <button type="button" id="account-menu-btn" class="inline-flex items-center gap-2 h-11 px-3 rounded-xl hover:bg-primary-light" aria-haspopup="true" aria-expanded="false" aria-controls="account-menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
            <span id="account-menu-label" class="hidden sm:inline text-sm font-medium">Account</span>
          </button>
          <div id="account-menu" role="menu" class="hidden absolute right-0 mt-2 w-52 bg-white border border-border rounded-xl shadow-lg py-1.5 text-sm">
            <div id="account-menu-guest">
              <a role="menuitem" href="/profile" class="block px-4 py-2 hover:bg-primary-light">Log in / Register</a>
            </div>
            <div id="account-menu-user" class="hidden">
              <a role="menuitem" href="/profile" class="block px-4 py-2 hover:bg-primary-light">My profile</a>
              <a role="menuitem" href="/order-history" class="block px-4 py-2 hover:bg-primary-light">Order history</a>
              <a role="menuitem" href="/restaurant-dashboard" class="block px-4 py-2 hover:bg-primary-light">Restaurant dashboard</a>
              <a role="menuitem" href="/rider-dashboard" class="block px-4 py-2 hover:bg-primary-light">Rider dashboard</a>
              <a role="menuitem" href="/admin-dashboard" class="block px-4 py-2 hover:bg-primary-light">Admin dashboard</a>
              <button role="menuitem" id="logout-btn" type="button" class="w-full text-left px-4 py-2 hover:bg-danger/10 text-danger">Log out</button>
            </div>
          </div>
        </div>

        <button type="button" id="mobile-menu-btn" class="md:hidden inline-flex items-center justify-center w-11 h-11 rounded-xl hover:bg-primary-light" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>

    <nav id="mobile-menu" class="hidden md:flex md:items-center gap-1 pb-3 md:pb-0 md:h-12 text-sm" aria-label="Primary">
      <a href="/" class="nav-link px-3 py-2 rounded-lg hover:bg-primary-light">Home</a>
      <a href="/restaurants" class="nav-link px-3 py-2 rounded-lg hover:bg-primary-light">Restaurants</a>
      <a href="/order-history" class="nav-link px-3 py-2 rounded-lg hover:bg-primary-light">Orders</a>
      <a href="/support" class="nav-link px-3 py-2 rounded-lg hover:bg-primary-light">Support</a>
      <form action="/restaurants" method="get" class="md:hidden mt-2 relative" role="search">
        <label for="nav-search-mobile" class="sr-only">Search restaurants or food</label>
        <input id="nav-search-mobile" name="q" type="search" placeholder="Search restaurants or dishes..." class="field-input" />
      </form>
    </nav>
  </div>
</header>
