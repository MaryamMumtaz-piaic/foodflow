<div id="food-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="food-modal-title">
  <div class="modal-panel">
    <div class="relative">
      <img id="food-modal-image" src="" alt="" class="w-full h-56 object-cover rounded-t-2xl" />
      <button type="button" data-modal-close class="absolute top-3 right-3 w-9 h-9 rounded-full bg-white/90 flex items-center justify-center shadow" aria-label="Close food details">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="p-5">
      <h2 id="food-modal-title" class="font-display text-xl font-bold"></h2>
      <p id="food-modal-description" class="text-ink-soft text-sm mt-1"></p>

      <div class="flex flex-wrap gap-3 mt-3 text-sm text-ink-soft">
        <span id="food-modal-portion"></span>
        <span id="food-modal-spice"></span>
      </div>

      <div class="mt-4">
        <h3 class="font-semibold text-sm mb-1">Ingredients</h3>
        <p id="food-modal-ingredients" class="text-sm text-ink-soft"></p>
      </div>

      <div class="mt-3">
        <h3 class="font-semibold text-sm mb-1">Dietary labels</h3>
        <div id="food-modal-labels" class="flex flex-wrap gap-2"></div>
      </div>

      <div class="mt-3">
        <h3 class="font-semibold text-sm mb-1">Allergen information</h3>
        <div id="food-modal-allergens"></div>
      </div>

      <div class="mt-4">
        <h3 class="font-semibold text-sm mb-1">Add-ons</h3>
        <div id="food-modal-addons"></div>
      </div>

      <div class="mt-4">
        <label class="field-label" for="food-modal-special">Special instructions</label>
        <textarea id="food-modal-special" rows="2" class="field-textarea" placeholder="e.g. no onions, extra spicy"></textarea>
      </div>

      <div class="flex items-center justify-between mt-5 gap-3">
        <div class="inline-flex items-center border border-border rounded-lg" role="group" aria-label="Quantity">
          <button type="button" id="food-modal-qty-minus" class="w-10 h-10" aria-label="Decrease quantity">−</button>
          <span id="food-modal-qty" class="w-10 text-center font-medium" aria-live="polite">1</span>
          <button type="button" id="food-modal-qty-plus" class="w-10 h-10" aria-label="Increase quantity">+</button>
        </div>
        <span id="food-modal-price" class="font-display text-xl font-bold"></span>
      </div>

      <button type="button" id="food-modal-add-to-cart" class="btn btn-primary w-full mt-4">Add to cart</button>
    </div>
  </div>
</div>
